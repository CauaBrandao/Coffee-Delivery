<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Road -->
  <ellipse cx="200" cy="260" rx="180" ry="20" fill="#F1E9C9"/>
  <!-- Motorcycle body -->
  <rect x="140" y="150" width="120" height="60" rx="8" fill="#DBAC2C"/>
  <!-- Wheels -->
  <circle cx="150" cy="220" r="30" fill="#403937" stroke="#C47F17" stroke-width="8"/>
  <circle cx="250" cy="220" r="30" fill="#403937" stroke="#C47F17" stroke-width="8"/>
  <!-- Delivery box -->
  <rect x="230" y="110" width="80" height="70" rx="6" fill="#8047F8"/>
  <rect x="236" y="116" width="68" height="58" rx="4" fill="#4B2995"/>
  <line x1="270" y1="116" x2="270" y2="174" stroke="#8047F8" stroke-width="2"/>
  <!-- Rider -->
  <circle cx="185" cy="130" r="20" fill="#FAFAFA"/>
  <rect x="165" y="148" width="40" height="40" rx="4" fill="#574F4D"/>
  <!-- Helmet -->
  <path d="M165 125 Q185 100 205 125 Z" fill="#C47F17"/>
  <!-- Speed lines -->
  <line x1="30" y1="180" x2="90" y2="180" stroke="#C47F17" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="10" y1="195" x2="80" y2="195" stroke="#DBAC2C" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <line x1="40" y1="210" x2="100" y2="210" stroke="#8047F8" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
</svg>
