<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="favCupBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F5F2EF"/>
      <stop offset="100%" stop-color="#D5CECB"/>
    </linearGradient>
    <radialGradient id="favCrema" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#E5A65E"/>
      <stop offset="50%" stop-color="#C47F17"/>
      <stop offset="100%" stop-color="#4A2609"/>
    </radialGradient>
    <linearGradient id="favPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A65FF"/>
      <stop offset="100%" stop-color="#4B2995"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C358"/>
      <stop offset="100%" stop-color="#C47F17"/>
    </linearGradient>
    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#272221" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Saucer -->
  <ellipse cx="32" cy="53" rx="26" ry="6" fill="#CDC6C1" opacity="0.3"/>
  <ellipse cx="32" cy="52" rx="25" ry="5.5" fill="#E8E4DF"/>
  <ellipse cx="32" cy="51.5" rx="23" ry="4.5" fill="#FFFFFF" opacity="0.8"/>

  <!-- Cup Group -->
  <g filter="url(#favShadow)">
    <!-- Handle -->
    <path d="M 42 27 C 51 27 54 41 43 45 C 41 45.5 39 44 39 42 C 45 39 45 32 39 31 Z" fill="url(#favCupBody)" stroke="#CDC6C1" stroke-width="0.8"/>
    <!-- Bowl -->
    <path d="M 16 24 C 16.5 38 22 50 32 50 C 42 50 47.5 38 48 24 Z" fill="url(#favCupBody)" stroke="#E8E4DF" stroke-width="0.6"/>
    <!-- Rim -->
    <ellipse cx="32" cy="24" rx="16" ry="4.5" fill="#FFFFFF"/>
    <!-- Coffee Surface -->
    <ellipse cx="32" cy="24.5" rx="14.5" ry="3.8" fill="url(#favCrema)"/>
    <!-- Heart latte art -->
    <path d="M 32 26.5 C 28 24 27 22.5 29.5 22 C 31.5 21.5 32 23 32 23 C 32 23 32.5 21.5 34.5 22 C 37 22.5 36 24 32 26.5 Z" fill="#FFF6ED" opacity="0.9"/>
  </g>

  <!-- Steam -->
  <path d="M 26 18 C 24 14 27 10 25 5" stroke="url(#favPurple)" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M 32 17 C 30 12 34 8 32 3" stroke="url(#favPurple)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 38 18 C 40 14 37 10 39 5" stroke="url(#favPurple)" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Bean -->
  <g transform="translate(45, 9) rotate(20) scale(0.65)">
    <ellipse cx="7" cy="5" rx="7" ry="5" fill="url(#favGold)"/>
    <path d="M 2 5 Q 7 2 12 5" stroke="#7B4412" stroke-width="1.2" fill="none"/>
  </g>
</svg>
